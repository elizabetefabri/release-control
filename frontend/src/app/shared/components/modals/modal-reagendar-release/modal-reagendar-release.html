<p-dialog
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="modal-reagendar-release"
  [style]="{ width: 'min(100%, 37rem)' }"
  [header]="title()"
>
  <div class="modal-reagendar-release__content">
    <p>{{ message() }}</p>
  </div>

  <ng-template pTemplate="footer">
    <div class="modal-reagendar-release__footer">
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        label="Cancelar"
        (click)="onCancel()"
      ></button>
      <button
        pButton
        type="button"
        severity="primary"
        class="modal-reagendar-release__confirm"
        label="Confirmar"
        (click)="onConfirm()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
