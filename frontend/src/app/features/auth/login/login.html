<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1 class="auth-form__title">Entrar</h1>
  <p class="auth-form__subtitle">Acesse o painel de rollouts</p>

  @if (errorMsg(); as msg) {
    <div class="auth-form__error" role="alert">
      <app-icon name="circle-alert" [size]="16" />
      <span>{{ msg }}</span>
    </div>
  }

  <label class="auth-form__field">
    <span class="auth-form__label">E-mail</span>
    <input
      pInputText
      type="email"
      formControlName="email"
      autocomplete="username"
      placeholder="voce@gmail.com"
    />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="auth-form__hint">Informe um e-mail válido.</small>
    }
  </label>

  <label class="auth-form__field">
    <span class="auth-form__label">Senha</span>
    <p-password
      formControlName="password"
      [feedback]="false"
      [toggleMask]="true"
      inputStyleClass="auth-form__password-input"
      styleClass="auth-form__password"
      placeholder="••••••"
      autocomplete="current-password"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="auth-form__hint">Informe a senha.</small>
    }
  </label>

  <button
    pButton
    type="submit"
    class="auth-form__submit"
    [disabled]="loading()"
  >
    <app-icon [name]="loading() ? 'loader-circle' : 'log-in'" [size]="16" [spin]="loading()" />
    <span>{{ loading() ? 'Entrando…' : 'Entrar' }}</span>
  </button>

  <p class="auth-form__foot">
    Não tem conta?
    <a routerLink="/cadastro" class="auth-form__link">Cadastre-se</a>
  </p>

  <p class="auth-form__mock">Teste: <strong>admin&#64;gmail.com</strong> / <strong>123456</strong></p>
</form>
