<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1 class="auth-form__title">Criar conta</h1>
  <p class="auth-form__subtitle">Cadastre-se para acessar o painel</p>

  @if (errorMsg(); as msg) {
    <div class="auth-form__error" role="alert">
      <app-icon name="circle-alert" [size]="16" />
      <span>{{ msg }}</span>
    </div>
  }

  <label class="auth-form__field">
    <span class="auth-form__label">Nome</span>
    <input pInputText type="text" formControlName="name" placeholder="Seu nome" autocomplete="name" />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <small class="auth-form__hint">Informe seu nome.</small>
    }
  </label>

  <label class="auth-form__field">
    <span class="auth-form__label">E-mail</span>
    <input
      pInputText
      type="email"
      formControlName="email"
      placeholder="voce@itau.com"
      autocomplete="username"
    />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="auth-form__hint">Informe um e-mail válido.</small>
    }
  </label>

  <label class="auth-form__field">
    <span class="auth-form__label">Telefone <span class="auth-form__opt">(opcional)</span></span>
    <input pInputText type="tel" formControlName="phone" placeholder="(11) 90000-0000" autocomplete="tel" />
  </label>

  <label class="auth-form__field">
    <span class="auth-form__label">Senha</span>
    <p-password
      formControlName="password"
      [feedback]="false"
      [toggleMask]="true"
      inputStyleClass="auth-form__password-input"
      styleClass="auth-form__password"
      placeholder="Mínimo 6 caracteres"
      autocomplete="new-password"
    />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="auth-form__hint">A senha deve ter ao menos 6 caracteres.</small>
    }
  </label>

  <label class="auth-form__field">
    <span class="auth-form__label">Confirmar senha</span>
    <p-password
      formControlName="confirm"
      [feedback]="false"
      [toggleMask]="true"
      inputStyleClass="auth-form__password-input"
      styleClass="auth-form__password"
      placeholder="Repita a senha"
      autocomplete="new-password"
    />
    @if (form.touched && form.errors?.['mismatch']) {
      <small class="auth-form__hint">As senhas não coincidem.</small>
    }
  </label>

  <button pButton type="submit" class="auth-form__submit" [disabled]="loading()">
    <app-icon [name]="loading() ? 'loader-circle' : 'user-plus'" [size]="16" [spin]="loading()" />
    <span>{{ loading() ? 'Cadastrando…' : 'Cadastrar' }}</span>
  </button>

  <p class="auth-form__foot">
    Já tem conta?
    <a routerLink="/login" class="auth-form__link">Entrar</a>
  </p>
</form>
